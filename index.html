<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Your Online Friend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#0b3d3a;
    --teal-700:#0f5c56;
    --teal-600:#137a70;
    --sand:#faf3e6;
    --sand-card:#fffaf0;
    --coral:#ff7a59;
    --coral-dark:#e85f3e;
    --green:#2ecc71;
    --ink:#1f2a28;
    --muted:#5b6b68;
    --border:#e6dcc6;
    --radius:22px;
    --shadow:0 10px 24px rgba(11,61,58,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 16px 28px;
  }
  .wrap{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  header.top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding-top:6px;
  }
  .avatar-wrap{position:relative; width:56px; height:56px; flex:0 0 auto;}
  .avatar{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(160deg,var(--teal-600),var(--teal-900));
    display:flex;align-items:center;justify-content:center;
    font-size:28px;
    box-shadow:var(--shadow);
  }
  .status-dot{
    position:absolute; bottom:1px; right:1px;
    width:16px;height:16px;border-radius:50%;
    background:var(--green);
    border:3px solid var(--sand);
  }
  .status-dot::after{
    content:"";
    position:absolute; inset:-6px;
    border-radius:50%;
    border:2px solid var(--green);
    opacity:.55;
    animation:pulse 2s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(.6); opacity:.6;}
    80%{transform:scale(1.8); opacity:0;}
    100%{opacity:0;}
  }
  .brand-name{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    font-size:1.35rem;
    color:var(--teal-900);
    line-height:1.1;
  }
  .brand-sub{
    font-size:.8rem;
    color:var(--green);
    font-weight:600;
    display:flex;align-items:center;gap:6px;
  }
  main{display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center;}
  h1{
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(2rem,7vw,2.7rem);
    color:var(--teal-900);
    margin:0;
    line-height:1.05;
  }
  .subline{
    font-size:1.05rem;
    color:var(--muted);
    margin:0;
    max-width:38ch;
  }
  .cards{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  a.card{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--sand-card);
    border:2px solid var(--border);
    border-radius:var(--radius);
    padding:18px 16px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
    min-height:88px;
  }
  a.card:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(11,61,58,.16);}
  a.card:active{transform:translateY(0) scale(.98);}
  a.card:focus-visible{
    outline:3px solid var(--teal-700);
    outline-offset:3px;
  }
  a.card.popular{
    border-color:var(--coral);
    box-shadow:0 12px 28px rgba(255,122,89,.28);
  }
  .badge{
    position:absolute;
    top:-12px;
    right:18px;
    background:var(--coral);
    color:#fff;
    font-family:'Baloo 2',cursive;
    font-weight:700;
    font-size:.75rem;
    padding:5px 12px;
    border-radius:999px;
    box-shadow:0 4px 10px rgba(232,95,62,.4);
  }
  .plan-icon{
    flex:0 0 auto;
    width:56px;height:56px;
    display:flex;align-items:center;justify-content:center;
    background:var(--teal-700);
    border-radius:16px;
    color:#fff;
  }
  .plan-icon svg{width:28px;height:28px;}
  .plan-info{flex:1 1 auto; text-align:left; min-width:0;}
  .plan-name{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    font-size:1.2rem;
    color:var(--teal-900);
    margin:0 0 2px;
  }
  .stars{display:flex; gap:3px; margin-bottom:4px;}
  .stars .star{width:15px;height:15px; color:var(--coral); fill:var(--coral);}
  .price{
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:1.3rem;
    color:var(--teal-700);
    margin:0;
  }
  .price small{font-size:.7rem; font-weight:600; color:var(--muted);}
  .go-arrow{
    flex:0 0 auto;
    width:46px;height:46px;
    border-radius:50%;
    background:var(--coral);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;
    font-weight:700;
    box-shadow:0 6px 14px rgba(255,122,89,.4);
  }
  .trust-row{
    width:100%;
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:14px 6px;
    background:var(--sand-card);
    border:2px solid var(--border);
    border-radius:18px;
  }
  .trust-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:.8rem;
    font-weight:600;
    color:var(--teal-900);
  }
  .trust-item .icon{font-size:1.5rem;}
  footer{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-top:4px;
    text-align:center;
  }
  .whatsapp-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    font-weight:700;
    padding:12px 22px;
    border-radius:999px;
    box-shadow:0 8px 18px rgba(37,211,102,.35);
  }
  .whatsapp-link:focus-visible{outline:3px solid var(--teal-700); outline-offset:3px;}
  .footer-note{font-size:.8rem; color:var(--muted);}

  @media (prefers-reduced-motion: reduce){
    .status-dot::after{animation:none;}
    a.card{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="avatar-wrap">
      <div class="avatar">💬</div>
      <span class="status-dot" aria-hidden="true"></span>
    </div>
    <div>
      <div class="brand-name">Your Online Friend</div>
      <div class="brand-sub">🟢 Online now</div>
    </div>
  </header>

  <main>
    <h1>Get Access Today</h1>
    <p class="subline">Chat, learn, and get help anytime. Pick a plan below to start.</p>

    <div class="cards">
      <a class="card" href="https://www.stateflix.com/user/register.php?ref=Youaremostwelcome&plan=basic&price=20000">
        <div class="plan-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>

          <p class="price">20,000 <small>UGX</small></p>
        </div>
        <div class="go-arrow">→</div>
      </a>

      <a class="card popular" href="https://www.stateflix.com/user/register.php?ref=Youaremostwelcome&plan=standard&price=25000">
        <span class="badge">Most Popular</span>
        <div class="plan-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="plan-info">
          <p class="plan-name">Standard</p>
          <div class="stars" aria-label="2 stars"><svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.6 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z"/></svg><svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.6 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z"/></svg></div>
          <p class="price">25,000 <small>UGX</small></p>
        </div>
        <div class="go-arrow">→</div>
      </a>

      <a class="card" href="https://www.stateflix.com/user/register.php?ref=Youaremostwelcome&plan=premium&price=35000">
        <div class="plan-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 20h20"/>
            <path d="M4 20 2.5 9l5.5 4L12 6l4 7 5.5-4L20 20"/>
          </svg>
        </div>
        <div class="plan-info">
          <p class="plan-name">Premium</p>
          <div class="stars" aria-label="3 stars"><svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.6 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z"/></svg><svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.6 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z"/></svg><svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.6 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z"/></svg></div>
          <p class="price">35,000 <small>UGX</small></p>
        </div>
        <div class="go-arrow">→</div>
      </a>
    </div>

    <div class="trust-row">
      <div class="trust-item"><span class="icon">🔒</span>Safe</div>
      <div class="trust-item"><span class="icon">⚡</span>Fast</div>
      <div class="trust-item"><span class="icon">🤝</span>Friendly</div>
    </div>
  </main>

  <footer>
    <a class="whatsapp-link" href="https://wa.me/256000000000" target="_blank" rel="noopener">
      🟢 Help on WhatsApp
    </a>
    <div class="footer-note">Your Online Friend · Uganda</div>
  </footer>
</div>
</body>
</html>
